<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f5f7fb"><title>MySocial</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}.app{max-width:620px;margin:auto;padding-bottom:75px}.top{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5e8ee}.brand{font-size:21px;font-weight:800}.btn{border:0;background:none;font-size:21px;padding:8px}.content{padding:12px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:15px;margin-bottom:12px;padding:13px}.row{display:flex;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover}.composer textarea{flex:1;border:0;outline:0;resize:none;font-size:15px;padding:10px}.actions,.postactions{border-top:1px solid #eee;margin-top:8px;padding-top:8px;display:flex;gap:8px}.actions button,.postactions button{border:0;background:none;padding:8px;color:#596273;font-weight:600}.posthead{display:flex;align-items:center;gap:10px}.meta{flex:1}.meta small{display:block;color:#7b8493;margin-top:3px}.text{font-size:15px;line-height:1.5}.postimg{width:100%;border-radius:10px;max-height:480px;object-fit:cover}.engage{display:flex;justify-content:space-between;color:#788294;font-size:12px;padding:9px 0}.liked{color:#1877f2!important}.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #e4e8ef;display:flex;justify-content:space-around;align-items:center}.bottom button{border:0;background:none;color:#687386}.active{color:#1877f2!important}.fab{background:#1877f2!important;color:#fff!important;border-radius:50%!important;width:46px;height:46px;font-size:24px}.title{font-size:22px;font-weight:800;margin:5px 0 15px}.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px}
</style></head><body><div id="app"></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const u=tg?.initDataUnsafe?.user||{first_name:"You",username:"telegram_user",photo_url:"https://i.pravatar.cc/100?img=5"};
let tab="home",posts=[
{id:1,n:"Sarah Johnson",h:"@sarahj",t:"2h",a:"https://i.pravatar.cc/100?img=47",x:"Beautiful day to slow down, enjoy the little things, and smile. ☀️",i:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80",l:124,c:23,y:0},
{id:2,n:"Michael Carter",h:"@mcarter",t:"5h",a:"https://i.pravatar.cc/100?img=12",x:"Working on something exciting. More to come soon! 🚀",i:"",l:76,c:11,y:1},
{id:3,n:"Ava Williams",h:"@avaw",t:"Yesterday",a:"https://i.pravatar.cc/100?img=32",x:"Good people, good food, good memories. ❤️",i:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80",l:201,c:39,y:0}];
function post(p){return '<article class="card"><div class="posthead"><img class="avatar" src="'+p.a+'"><div class="meta"><b>'+p.n+' ✓</b><small>'+p.h+' · '+p.t+'</small></div><button class="btn">•••</button></div><p class="text">'+p.x+'</p>'+(p.i?'<img class="postimg" src="'+p.i+'">':'')+'<div class="engage"><span>❤️ '+p.l+'</span><span>'+p.c+' comments</span></div><div class="postactions"><button class="'+(p.y?'liked':'')+'" onclick="like('+p.id+')">♥ Like</button><button onclick="comment('+p.id+')">💬 Comment</button><button>↗ Share</button></div></article>'}
function page(){if(tab=="home")return '<section class="card composer"><div class="row"><img class="avatar" src="'+(u.photo_url||"https://i.pravatar.cc/100?img=5")+'"><textarea id="newpost" rows="2" placeholder="What\'s on your mind?"></textarea></div><div class="actions"><button>📷 Photo</button><button>😊 Feeling</button><button onclick="add()" style="margin-left:auto;background:#1877f2;color:#fff;border-radius:8px">Post</button></div></section>'+posts.map(post).join("");
if(tab=="search")return '<h2 class="title">Search</h2><input class="search" id="q" oninput="find()" placeholder="Search people or posts"><div id="results">'+posts.map(post).join("")+'</div>';
if(tab=="alerts")return '<h2 class="title">Notifications</h2>'+["Sarah liked your post ❤️","Michael commented on your post 💬","Ava started following you 👤"].map(x=>'<div class="card">'+x+'<br><small>Recently</small></div>').join("");
if(tab=="friends")return '<h2 class="title">Friends</h2>'+["Emma Wilson","James Brown","Sophia Lee","Liam Davis"].map((x,i)=>'<div class="card row"><img class="avatar" src="https://i.pravatar.cc/100?img='+(50+i)+'"><b style="flex:1">'+x+'</b><button>Add</button></div>').join("");
return '<div class="card"><h2>'+((u.first_name||"You")+" "+(u.last_name||""))+'</h2><p>@'+(u.username||"telegram_user")+'</p><p>Sharing moments and building connections. ✨</p><b>'+posts.length+'</b> Posts &nbsp; <b>248</b> Followers</div>'}
function render(){document.getElementById("app").innerHTML='<div class="app"><header class="top"><button class="btn">☰</button><div class="brand">MySocial</div><div><button class="btn" onclick="go(\'search\')">⌕</button><button class="btn" onclick="go(\'alerts\')">🔔</button></div></header><main class="content">'+page()+'</main><nav class="bottom"><button class="'+(tab=="home"?"active":"")+'" onclick="go(\'home\')">⌂<br><small>Home</small></button><button class="'+(tab=="friends"?"active":"")+'" onclick="go(\'friends\')">♙<br><small>Friends</small></button><button class="fab" onclick="go(\'home\');setTimeout(()=>document.getElementById(\'newpost\')?.focus(),50)">+</button><button class="'+(tab=="alerts"?"active":"")+'" onclick="go(\'alerts\')">♧<br><small>Alerts</small></button><button class="'+(tab=="profile"?"active":"")+'" onclick="go(\'profile\')">●<br><small>Profile</small></button></nav></div>'}
function go(x){tab=x;render()}function like(id){let p=posts.find(a=>a.id==id);p.y=!p.y;p.l+=p.y?1:-1;render()}function comment(id){let x=prompt("Write a comment");if(x?.trim()){posts.find(a=>a.id==id).c++;render()}}function add(){let e=document.getElementById("newpost"),x=e.value.trim();if(!x)return;posts.unshift({id:Date.now(),n:(u.first_name||"You")+" "+(u.last_name||""),h:u.username?"@"+u.username:"@telegram_user",t:"now",a:u.photo_url||"https://i.pravatar.cc/100?img=5",x,i:"",l:0,c:0,y:0});render()}function find(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("results").innerHTML=posts.filter(p=>(p.n+" "+p.x).toLowerCase().includes(q)).map(post).join("")}render();
</script></body></html>
